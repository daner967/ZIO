<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ZIO</title>
<style>
:root{--bg:#F5F0FE;--card:#FFFFFF;--ink:#1B1030;--mute:#675987;--line:#DDD0F4;--off:#A593C8;--acc:#9647F4;--accT:#7B2FE3;--track:#3B2470;--bad:#B3261E;--on:#FFFFFF;--tile:#9647F4;--tileb:transparent;--pop:var(--card)}
@media(prefers-color-scheme:dark){:root{--bg:#130B24;--card:#1E1335;--ink:#F2ECFF;--mute:#AB9DCB;--line:#34255A;--off:#5B4690;--accT:#B98BFF;--bad:#FF9A92}}
/* Temas: el morado sigue al modo claro/oscuro del teléfono; los demás son fijos */
:root[data-theme=black]{--bg:#000000;--card:#0E0E0E;--ink:#FFFFFF;--mute:#A6A6A6;--line:#2B2B2B;--off:#5C5C5C;--acc:#FFFFFF;--accT:#FFFFFF;--on:#000000;--track:#9A9A9A;--bad:#FF8A8A;--tile:#FFFFFF;--tileb:transparent;color-scheme:dark}
:root[data-theme=white]{--bg:#FAFAFA;--card:#FFFFFF;--ink:#000000;--mute:#4D4D4D;--line:#CFCFCF;--off:#8F8F8F;--acc:#000000;--accT:#000000;--on:#FFFFFF;--track:#5A5A5A;--bad:#B3261E;--tile:#FFFFFF;--tileb:#000000;color-scheme:light}
:root[data-theme=green]{--bg:#04100A;--card:#0A1D12;--ink:#E8FFF0;--mute:#8FB89E;--line:#17402A;--off:#2F6B49;--acc:#2BF56F;--accT:#2BF56F;--on:#04100A;--track:#5E8F6E;--bad:#FF9A92;--tile:#2BF56F;--tileb:transparent;color-scheme:dark}
:root[data-theme=red]{--bg:#14060A;--card:#200B11;--ink:#FFECEF;--mute:#C79AA4;--line:#4A1824;--off:#7A3342;--acc:#FF3D5A;--accT:#FF6B82;--on:#14060A;--track:#B86878;--bad:#FFD166;--tile:#FF3D5A;--tileb:transparent;color-scheme:dark}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(var(--veil,transparent),var(--veil,transparent)),var(--bgimg,none) center top/cover no-repeat}
:root[data-theme=blackpurple]{--bg:#000000;--card:#0F0A18;--ink:#F2ECFF;--mute:#A99BC7;--line:#2A1F42;--off:#4B3A73;--acc:#9647F4;--accT:#B98BFF;--on:#FFFFFF;--track:#3B2470;--bad:#FF9A92;--tile:#9647F4;--tileb:transparent;color-scheme:dark}
:root[data-theme=xmas]{--bg:#4A0006;--bgimg:url(xmas.jpg);--veil:rgba(45,0,8,.55);--card:rgba(66,0,14,.92);--pop:#3B0710;--ink:#FFFFFF;--mute:#FFD3D9;--line:rgba(255,255,255,.3);--off:#8A2A38;--acc:#FFFFFF;--accT:#FFFFFF;--on:#A30018;--track:#F3A6B0;--bad:#FFE08A;--tile:#570104;--tileb:#FFFFFF;color-scheme:dark}
:root[data-theme=xmas] .mark img{width:100%;height:100%;object-fit:cover}
:root[data-theme=xmas] .thumb .ph{width:34%;border-radius:12px;overflow:hidden}
:root[data-theme=xmas] :is(.lead,.note,.sec,#msg,footer,.olink,.ptitle,h1,.hint){text-shadow:0 1px 3px rgba(40,0,6,.85)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
main{max-width:34rem;margin:0 auto;padding:24px 20px 40px}
button{font:inherit;color:inherit;cursor:pointer}
.brand{position:relative;display:flex;align-items:stretch;gap:14px;padding-bottom:16px;border-bottom:3px solid var(--acc);margin-bottom:20px}
.mark{flex:none;width:64px;height:64px;border-radius:18px;background:var(--tile);border:2px solid var(--tileb);display:grid;place-items:center;overflow:hidden}
.mark img{width:68%;height:auto;display:block}
h1{margin:0;padding-left:14px;border-left:3px solid var(--acc);display:flex;align-items:center;font:600 clamp(2.4rem,13vw,3.2rem)/1 "Iowan Old Style","Noto Serif",Georgia,serif;letter-spacing:-.02em}
.gear{margin-left:auto;align-self:flex-start;width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--mute);display:grid;place-items:center}
.gear svg{width:22px;height:22px}
.menu{position:absolute;right:0;top:60px;z-index:5;width:min(330px,100%);background:var(--pop);border:1.5px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 10px 28px rgba(27,16,48,.28)}
.menu>button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 12px;border:0;background:none;border-radius:10px;text-align:left;font-weight:600}
.menu>button:active{background:var(--bg)}
.mtheme{padding:8px 6px 6px;border-top:1px solid var(--line);margin-top:4px}
.mtheme>span{display:block;font-weight:600;margin:0 6px 4px}
.mtheme small{display:block;margin:2px 6px 4px;color:var(--mute)}
.swatches{display:flex;flex-wrap:wrap;justify-content:space-between}
.tsw{width:42px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:50%}
.tsw i{display:block;width:30px;height:30px;border-radius:50%;border:2px solid #6B6B6B}
.tsw[aria-checked=true] i{outline:3px solid var(--accT);outline-offset:2px}
.tsw[data-th=purple] i{background:#9647F4;border-color:#9647F4}
.tsw[data-th=black] i{background:radial-gradient(circle,#fff 0 26%,#000 29%)}
.tsw[data-th=white] i{background:radial-gradient(circle,#000 0 26%,#fff 29%)}
.tsw[data-th=green] i{background:#2BF56F;border-color:#2BF56F}
.tsw[data-th=red] i{background:#FF3D5A;border-color:#FF3D5A}
.tsw[data-th=blackpurple] i{background:radial-gradient(circle,#9647F4 0 26%,#000 29%)}
.tsw[data-th=xmas] i{background:repeating-linear-gradient(45deg,#E01E37 0 5px,#fff 5px 10px);border-color:#fff}
.menu>small{display:block;margin:-4px 12px 6px;color:var(--mute);font-size:.8rem;line-height:1.3}
.mlang{padding:8px 6px 6px;border-top:1px solid var(--line);margin-top:4px}
.mlang>span{display:block;font-weight:600;margin:0 6px 8px}
.sw{flex:none;position:relative;width:42px;height:24px;border-radius:12px;background:var(--off)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff}
[aria-checked=true] .sw{background:var(--acc)}
[aria-checked=true] .sw::after{left:21px;background:var(--on)}
.lead{color:var(--mute);margin:0 0 24px;max-width:30ch}
.field{display:flex;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 6px 16px}
.field:focus-within{border-color:var(--acc)}
input{flex:1;min-width:0;border:0;outline:0;background:none;color:inherit;font:inherit}
.ghost{border:0;background:var(--bg);border-radius:11px;padding:0 14px;min-height:44px;font-weight:600}
.hint{margin:12px 2px 0;color:var(--mute);font-size:.92rem;border-left:3px solid var(--acc);padding-left:10px}
.go{display:block;width:100%;min-height:62px;margin-top:20px;border:0;border-radius:999px;font-size:1.1rem;font-weight:700;color:var(--on);--p:100%;background:linear-gradient(90deg,var(--acc) var(--p),var(--track) var(--p))}
.stop{display:block;margin:10px auto 0;border:0;background:none;color:var(--mute);text-decoration:underline;min-height:44px}
#msg{margin:12px 2px 0;font-weight:600}
#msg.err{color:var(--bad)}
.sec{font-size:1rem;margin:26px 2px 10px;color:var(--accT);font-weight:700}
ul{list-style:none;margin:0;padding:0}
li{padding:12px 2px;border-top:1px solid var(--line)}
li b{display:block;font-weight:600;overflow-wrap:anywhere}
li span{color:var(--mute);font-size:.88rem}
footer{margin-top:32px;color:var(--mute);font-size:.88rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.link{border:0;background:none;color:var(--accT);text-decoration:underline;min-height:44px;padding:0}
.top{display:flex;align-items:center;gap:6px;padding-bottom:12px;border-bottom:3px solid var(--acc);margin-bottom:20px}
.back{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:none;display:grid;place-items:center}
.back svg{width:24px;height:24px}
.ptitle{margin:0;font:600 1.4rem/1.2 "Iowan Old Style","Noto Serif",Georgia,serif}
.olink{margin:0 0 16px;color:var(--mute);font-size:.9rem;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--line);padding:4px;border-radius:14px}
.seg button{border:0;background:none;min-height:44px;border-radius:10px;font-weight:600;color:var(--mute)}
.seg .on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--acc)}
.seg button:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.chip:disabled{opacity:.4}
.rsw{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 14px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;font-weight:600;text-align:left}
.note{margin:8px 2px 0;color:var(--mute);font-size:.88rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mini{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--acc);background:none;color:var(--accT);font-weight:600;font-size:.9rem}
.items{margin:10px 0 0;padding-left:12px;border-left:3px solid var(--line)}
.items li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:0}
.items li div{min-width:0}
.wide{margin-top:12px}
.q .qs{display:block;color:var(--mute);font-size:.88rem}
.q .qs.bad{color:var(--bad)}
.q .pbar{height:8px;margin:8px 0 0}
.gone{display:block;color:var(--bad);font-size:.88rem;margin-top:2px}
.pk{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.pk div{min-width:0}
input[type=checkbox]{flex:none;width:22px;height:22px;margin-top:2px;accent-color:var(--acc)}
#pgo{position:sticky;bottom:12px;margin-top:16px}
#pgo:disabled{opacity:.5}
.items .acts{margin:0;flex:none}
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72)}
.sheet{width:100%;max-width:26rem;background:var(--pop);border:1.5px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 18px 48px rgba(0,0,0,.4)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:16px;background:var(--tile);border:2px solid var(--tileb);display:grid;place-items:center;overflow:hidden}
.thumb .ph{width:26%}
.thumb .ph img{width:100%;display:block}
.thumb #dimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dtitle{margin:14px 2px 12px;font-size:1.02rem;line-height:1.3;font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--acc);border-radius:6px;transition:width .25s}
@media(prefers-reduced-motion:reduce){.pbar i{transition:none}}
.pstat{display:flex;justify-content:space-between;gap:12px;margin:8px 2px 0;color:var(--mute);font-size:.92rem}
.pstat b{color:var(--ink);font-variant-numeric:tabular-nums}
.pstat.err span{color:var(--bad)}
.sheet .go{margin-top:14px;min-height:54px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
</style></head>
<body><main>

<section id="home">
  <header class="brand">
    <span class="mark"><img class="logo" src="logo.png" alt=""></span>
    <h1>ZIO</h1>
    <button class="gear" id="gear" data-al="gear" aria-label="Ajustes" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div class="menu" id="menu" hidden>
      <button id="mhist" data-i="m_hist">Historial de descargas</button>
      <button id="mtog" role="switch" aria-checked="true"><span data-i="m_tog">Mostrar historial en inicio</span><i class="sw"></i></button>
      <button id="mmob" role="switch" aria-checked="true"><span data-i="m_mobile">Descargar con datos móviles</span><i class="sw"></i></button>
      <button id="mmus" role="switch" aria-checked="true"><span data-i="m_music">Música de fondo</span><i class="sw"></i></button>
      <button id="micon" role="switch" aria-checked="false"><span data-i="m_icon">Cambiar el icono con el tema</span><i class="sw"></i></button>
      <small data-i="m_icon_note"></small>
      <div class="mtheme"><span data-i="m_theme">Tema</span>
        <div class="swatches" role="radiogroup">
          <button class="tsw" data-th="purple" role="radio" aria-checked="true"><i></i></button>
          <button class="tsw" data-th="blackpurple" role="radio" aria-checked="false"><i></i></button>
          <button class="tsw" data-th="black" role="radio" aria-checked="false"><i></i></button>
          <button class="tsw" data-th="white" role="radio" aria-checked="false"><i></i></button>
          <button class="tsw" data-th="green" role="radio" aria-checked="false"><i></i></button>
          <button class="tsw" data-th="red" role="radio" aria-checked="false"><i></i></button>
          <button class="tsw" data-th="xmas" role="radio" aria-checked="false"><i></i></button>
        </div>
        <small id="thname"></small>
      </div>
      <div class="mlang"><span data-i="m_lang">Idioma</span>
        <div class="seg" id="lang"><button data-l="es">Español</button><button data-l="en">English</button></div>
      </div>
    </div>
  </header>
  <p class="lead" data-i="lead"></p>
  <div class="field">
    <input id="url" type="url" inputmode="url" data-ph="ph" autocomplete="off" aria-label="Link">
    <button class="ghost" id="paste" data-i="paste">Pegar</button>
  </div>
  <p class="hint" id="hint" data-i="hint" hidden></p>
  <button class="go" id="go">Descargar</button>
  <p id="msg" role="status"></p>
  <div id="queue" hidden><h2 class="sec" data-i="queue">Descargas</h2><ul id="qlist"></ul></div>
  <div id="recent" hidden><h2 class="sec" data-i="recent">Recientes</h2><ul id="rlist"></ul></div>
  <footer><span><span data-i="engine">Motor yt-dlp</span> <span id="ver"></span></span><button class="link" id="upd" data-i="upd">Actualizar motor</button></footer>
</section>

<section id="opts" hidden>
  <div class="top">
    <button class="back" id="oback" data-al="back" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 class="ptitle" data-i="o_title">Opciones de descarga</h2>
  </div>
  <p class="olink" id="olink"></p>
  <div class="seg" id="otype"><button data-t="video">Video</button><button data-t="audio">Audio</button></div>
  <p class="note" id="olist" data-i="o_list" hidden></p>
  <button class="mini wide" id="opick" data-i="pk_open" hidden>Elegir canciones o videos</button>
  <p class="note" id="psel" hidden></p>

  <div id="sv">
    <h3 class="sec" data-i="vq_t">Calidad del video</h3>
    <div class="chips">
      <button class="chip" data-k="vq" data-v="max" data-i="max">Máxima</button>
      <button class="chip" data-k="vq" data-v="1080">1080p</button>
      <button class="chip" data-k="vq" data-v="720">720p</button>
      <button class="chip" data-k="vq" data-v="480">480p</button>
      <button class="chip" data-k="vq" data-v="360">360p</button>
    </div>
    <p class="note" data-i="vq_note"></p>
  </div>

  <div id="sa">
    <h3 class="sec" data-i="af_t">Formato del audio</h3>
    <div class="chips">
      <button class="chip" data-k="af" data-v="mp3">MP3</button>
      <button class="chip" data-k="af" data-v="m4a">M4A</button>
      <button class="chip" data-k="af" data-v="opus">OPUS</button>
      <button class="chip" data-k="af" data-v="flac">FLAC</button>
      <button class="chip" data-k="af" data-v="wav">WAV</button>
    </div>
    <p class="note" id="anote" hidden></p>
    <h3 class="sec" data-i="aq_t">Calidad del audio</h3>
    <div class="chips">
      <button class="chip" data-k="aq" data-v="best" data-i="best">Mejor</button>
      <button class="chip" data-k="aq" data-v="med" data-i="med">Media</button>
      <button class="chip" data-k="aq" data-v="low" data-i="low">Baja</button>
    </div>
  </div>

  <div id="sth">
    <h3 class="sec" data-i="th_t">Miniatura</h3>
    <button class="rsw" id="othumb" role="switch" aria-checked="true"><span data-i="th_sw">Guardar también como imagen aparte</span><i class="sw"></i></button>
    <p class="note" data-i="th_note"></p>
  </div>

  <button class="go" id="ostart" data-i="go">Descargar</button>
</section>

<section id="hview" hidden>
  <div class="top">
    <button class="back" id="hback" data-al="back" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 class="ptitle" data-i="h_title">Historial de descargas</h2>
  </div>
  <p class="note" id="hempty" data-i="h_empty">Todavía no hay descargas.</p>
  <ul id="hlist"></ul>
  <button class="link" id="hclear" hidden></button>
</section>

<section id="pview" hidden>
  <div class="top">
    <button class="back" id="pback" data-al="back" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 class="ptitle" data-i="pk_title">Elegir elementos</h2>
  </div>
  <p class="note" id="pinfo"></p>
  <div class="acts"><button class="mini" id="pall" data-i="pk_all">Todo</button><button class="mini" id="pnone" data-i="pk_none">Ninguno</button><button class="mini" id="pnew" data-i="pk_new">Solo nuevos</button></div>
  <ul id="plist"></ul>
  <button class="go" id="pgo"></button>
</section>

</main>

<div class="modal" id="dl" role="dialog" aria-modal="true" aria-labelledby="dtitle" hidden>
  <div class="sheet">
    <div class="thumb"><span class="ph" id="dph"><img class="logo" src="logo.png" alt=""></span><img id="dimg" alt="" hidden></div>
    <h3 class="dtitle" id="dtitle"></h3>
    <div class="pbar" id="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="pfill"></i></div>
    <p class="pstat" id="pstat"><span id="pst"></span><b id="ppct">0%</b></p>
    <button class="stop" id="dcancel" data-i="cancel">Cancelar</button>
    <button class="go" id="dclose" data-i="close" hidden>Cerrar</button>
    <button class="go" id="dupd" data-i="upd" hidden>Actualizar motor</button>
  </div>
</div>

<script>
const T={

const $=s=>document.querySelector(s),A=window.Android;
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function saveHist(){try{while(hist.length>1&&JSON.stringify(hist).length>2000000)hist.pop()}catch(e){}sv('h',hist)}
let P=Object.assign({type:'audio',vq:'720',af:'mp3',aq:'best',thumb:true,showHist:true,lang:'es',theme:'purple',mobile:true,music:true,iconSync:false},ld('p',{}));
let hist=ld('h',[]);if(!Array.isArray(hist))hist=[];
let sel={},view='home',item=0,total=0,listMode=false,armed=false,engVer='',jobs=[],curJob=0,rp=0,rid=0,pick={items:[],sel:new Set(),title:''};
const t=(k,a,b)=>{let s=(T[P.lang]||T.es)[k];if(s===undefined)s=T.es[k]||k;return s.replace('{a}',a).replace('{b}',b)};
// mensajes que llegan de la app: "codigo|detalle" se traducen; el resto (errores de yt-dlp) se muestra tal cual
function tm(m){
  if(!m)return '';
  const i=m.indexOf('|'),c=i<0?m:m.slice(0,i);
  return T.es[c]!==undefined?t(c)+(i<0?'':m.slice(i+1)):m;
}
// tema: [color de las barras del teléfono, ¿barras oscuras?]. El morado sigue al modo claro/oscuro del teléfono
const THEMES={purple:null,blackpurple:['#000000',true],black:['#000000',true],white:['#FFFFFF',false],green:['#04100A',true],red:['#14060A',true],xmas:['#4A0006',true]};
function applyTheme(){
  const th=THEMES.hasOwnProperty(P.theme)?P.theme:'purple';
  document.documentElement.dataset.theme=th;
  document.querySelectorAll('.logo').forEach(i=>{const s=th==='xmas'?'logo_xmas.jpg':'logo.png';if(i.getAttribute('src')!==s)i.setAttribute('src',s)});
  let bg,dark;
  if(THEMES[th]){bg=THEMES[th][0];dark=THEMES[th][1]}
  else{dark=matchMedia('(prefers-color-scheme: dark)').matches;bg=dark?'#130B24':'#F5F0FE'}
  try{A.bars(bg,dark)}catch(e){}
  document.querySelectorAll('.tsw').forEach(b=>{b.setAttribute('aria-checked',String(b.dataset.th===th));b.setAttribute('aria-label',t('th_'+b.dataset.th))});
  $('#thname').textContent=t('th_'+th);
}
function applyLang(){
  document.documentElement.lang=P.lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  document.querySelectorAll('[data-al]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.al)));
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===P.lang));
  $('#ver').textContent=engVer||t('starting');
  $('#hclear').textContent=t('h_clear');
  $('#go').textContent=t('go');
  drawQueue();
  applyTheme();
}
const isList=u=>/[?&]list=/.test(u)&&!/[?&]v=/.test(u)&&!/youtu\.be\//.test(u);
const cur=()=>$('#url').value.trim();
function show(v){view=v;['home','opts','hview','pview'].forEach(x=>$('#'+x).hidden=x!==v);window.scrollTo(0,0)}
function goBack(){
  if(!$('#dl').hidden){closeDl();return true}
  if(!$('#menu').hidden){closeMenu();return true}
  if(view==='pview'){show('opts');return true}
  if(view!=='home'){show('home');return true}
  return false;
}
function say(m,err){const e=$('#msg');e.textContent=m;e.className=err?'err':''}
function sync(){$('#hint').hidden=!isList(cur())}
function fmt(ts){
  if(!ts)return '';
  try{return new Date(ts).toLocaleString(P.lang,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}
}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function row(h,full,ex){
  const li=mk('li'),b=mk('b','',h.n),s=mk('span','',[h.ch,h.w?t('saved_in')+' '+h.w:'',fmt(h.t)].filter(Boolean).join(' · '));
  li.append(b,s);
  if(full&&h.v&&!ex)li.append(mk('span','gone',t('deleted')));
  if(h.req){
    const a=mk('div','acts');
    if(full&&h.v&&ex)a.append(btn(t('open'),()=>A.open(h.v,h.m||'*/*')),btn(t('share'),()=>A.share(h.v,h.m||'*/*')));
    a.append(btn(t('redo'),()=>redo(h)));
    const its=(h.items||[]).filter(i=>i.u);
    if(full&&its.length)a.append(btn(t('items')+' ('+its.length+')',()=>toggleItems(li,h,its)));
    if(full)a.append(btn(t('remove'),()=>{hist.splice(hist.indexOf(h),1);saveHist();drawHist();drawRecent()}));
    li.append(a);
  }
  return li;
}
function toggleItems(li,h,its){
  const old=li.querySelector('.items');
  if(old){old.remove();return}
  let ok=[];
  try{ok=JSON.parse(A.check(JSON.stringify(its.map(i=>i.v||''))))}catch(e){}
  const ul=mk('ul','items');
  its.forEach((it,k)=>{
    const r=mk('li'),d=mk('div'),a=mk('div','acts');
    d.append(mk('b','',it.t||it.u),mk('span','',it.c||''));
    if(it.v&&ok[k])a.append(btn(t('open'),()=>A.open(it.v,it.m||'*/*')));
    a.append(btn(t('redo_short'),()=>redoItem(h,it)));
    r.append(d,a);ul.append(r);
  });
  li.append(ul);
}
function drawRecent(){
  const l=$('#rlist');l.innerHTML='';
  hist.slice(0,5).forEach(h=>l.append(row(h,false)));
  $('#recent').hidden=!P.showHist||!hist.length;
}
function drawHist(){
  const l=$('#hlist');l.innerHTML='';
  let ok=[];
  try{ok=JSON.parse(A.check(JSON.stringify(hist.map(h=>h.v||''))))}catch(e){}
  hist.forEach((h,k)=>l.append(row(h,true,ok[k])));
  $('#hempty').hidden=hist.length>0;$('#hclear').hidden=!hist.length;
}
function syncMenu(){$('#mtog').setAttribute('aria-checked',String(!!P.showHist));$('#mmob').setAttribute('aria-checked',String(P.mobile!==false));$('#mmus').setAttribute('aria-checked',String(P.music!==false));$('#micon').setAttribute('aria-checked',String(!!P.iconSync))}
function closeMenu(){$('#menu').hidden=true;$('#gear').setAttribute('aria-expanded','false')}
// ----- cola de descargas
const active=()=>jobs.some(j=>j.state==='queued'||j.state==='running');
function btn(label,fn){const b=mk('button','mini',label);b.onclick=fn;return b}
function shortUrl(u){try{const x=new URL(u);return x.hostname.replace(/^www\./,'')+x.pathname.slice(0,24)}catch(e){return String(u).slice(0,40)}}
function drawQueue(){
  const l=$('#qlist');l.innerHTML='';
  jobs.forEach(j=>{
    const li=mk('li','q'),d=mk('div'),run=j.state==='running';
    const st=run?(rp>0?Math.round(rp)+'%':t('preparing')):j.state==='queued'?t('q_wait'):(tm(j.msg)||t('cancelled'));
    const s=mk('span',j.state==='stopped'&&j.msg!=='cancelled'?'qs bad':'qs',st);
    if(run)s.id='qst';
    d.append(mk('b','',j.title||shortUrl(j.url)),s);li.append(d);
    if(run){const pb=mk('div','pbar'),i=mk('i');i.id='qbar';i.style.width=rp+'%';pb.append(i);li.append(pb)}
    const a=mk('div','acts');
    if(run)a.append(btn(t('view'),()=>openDl()),btn(t('cancel'),()=>A.cancel(j.id)));
    else if(j.state==='queued')a.append(btn(t('cancel'),()=>A.cancel(j.id)));
    else a.append(btn(t('resume'),()=>A.retry(j.id)),btn(t('remove'),()=>A.remove(j.id)));
    li.append(a);l.append(li);
  });
  $('#queue').hidden=!jobs.length;
  $('#upd').disabled=active();
}
// ----- ventana de descarga (miniatura + barra de progreso)
function setP(p){
  p=Math.max(0,Math.min(100,p));
  $('#pfill').style.width=p+'%';$('#ppct').textContent=Math.round(p)+'%';
  $('#pbar').setAttribute('aria-valuenow',String(Math.round(p)));
}
function openDl(){$('#dl').hidden=false;$('main').inert=true;($('#dcancel').hidden?$('#dclose'):$('#dcancel')).focus()}
function closeDl(){$('#dl').hidden=true;$('main').inert=false}
function resetDl(){
  $('#dimg').hidden=true;$('#dimg').removeAttribute('src');$('#dph').hidden=false;
  $('#dtitle').textContent=t('dl_get');setP(0);
  $('#pstat').className='pstat';$('#pst').textContent=t('preparing');
  $('#dcancel').hidden=false;$('#dclose').hidden=true;$('#dupd').hidden=true;
}
function endDl(msg,err,code){
  $('#pstat').className=err?'pstat err':'pstat';$('#pst').textContent=msg;
  $('#dcancel').hidden=true;$('#dclose').hidden=false;
  $('#dupd').hidden=!(err&&['e_extract','e_bot','e_format'].indexOf(code)>=0);
}
// ----- iniciar una descarga (nueva, repetida desde el historial, o un elemento de una lista)
function launch(url,mode,opts){
  const first=!active();
  say('');show('home');
  let id=-1;
  try{id=A.start(url,mode,JSON.stringify(Object.assign({},opts,{lang:P.lang,mobile:P.mobile!==false})))}catch(e){}
  if(id>0){if(first){rp=0;item=0;total=0;resetDl();openDl()}else say(t('queued'))}
}
function redo(h){launch(h.req.url,h.req.mode,Object.assign({},h.req.opts,{list:!!h.req.list}))}
function redoItem(h,it){launch(it.u,h.req.mode,Object.assign({},h.req.opts,{list:false,items:'',sub:h.pl||'',idx:it.i||0}))}
// ----- pantalla de opciones
function renderOpts(){
  document.querySelectorAll('#otype button').forEach(b=>b.classList.toggle('on',b.dataset.t===sel.type));
  $('#sv').hidden=sel.type!=='video';
  $('#sa').hidden=sel.type!=='audio';
  $('#olist').hidden=!listMode;
  $('#opick').hidden=!listMode;
  const ps=$('#psel');
  if(listMode&&sel.items){ps.hidden=false;ps.textContent=t('pk_sel',pick.sel.size,pick.items.length)}else ps.hidden=true;
  const raw=sel.af==='flac'||sel.af==='wav';
  $('#anote').hidden=!raw;
  $('#anote').textContent=t('af_note')+(sel.af==='wav'?' '+t('wav_note'):'');
  $('#othumb').setAttribute('aria-checked',String(!!sel.thumb));
  document.querySelectorAll('.chip').forEach(c=>{
    c.classList.toggle('on',sel[c.dataset.k]===c.dataset.v);
    c.disabled=raw&&c.dataset.k==='aq';
  });
}
function openOpts(){
  const u=cur();
  if(!/^https?:\/\//i.test(u)){say(t('bad_link'),true);return}
  say('');listMode=isList(u);
  sel=Object.assign({},P);sel.items='';
  pick={items:[],sel:new Set(),title:''};
  $('#olink').textContent=u;
  renderOpts();show('opts');
}
// ----- elegir elementos de una lista
function vid(u){const m=/[?&]v=([\w-]{11})/.exec(u||'')||/youtu\.be\/([\w-]{11})/.exec(u||'')||/\/shorts\/([\w-]{11})/.exec(u||'');return m?m[1]:''}
function knownIds(){
  const s=new Set();
  hist.forEach(h=>{
    if(h.req&&!h.req.list){const v=vid(h.req.url);if(v)s.add(v)}
    (h.items||[]).forEach(i=>{const v=i.id||vid(i.u);if(v)s.add(v)});
  });
  return s;
}
function dur(s){if(!s)return '';const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+x:m+':'+x}
function ranges(set){
  const a=[...set].sort((x,y)=>x-y),o=[];
  let s=a[0],p=a[0];
  for(let k=1;k<=a.length;k++){const v=a[k];if(v===p+1){p=v;continue}o.push(s===p?String(s):s+'-'+p);s=v;p=v}
  return o.join(',');
}
function updPick(){
  $('#pgo').textContent=t('pk_use',pick.sel.size);
  $('#pgo').disabled=!pick.sel.size;
  $('#pinfo').textContent=(pick.title?pick.title+' · ':'')+t('pk_count',pick.items.length);
}
function drawPick(){
  const l=$('#plist');l.innerHTML='';
  pick.items.forEach(it=>{
    const li=mk('li'),lb=mk('label','pk'),cb=document.createElement('input'),d=mk('div');
    cb.type='checkbox';cb.checked=pick.sel.has(it.i);
    cb.onchange=()=>{if(cb.checked)pick.sel.add(it.i);else pick.sel.delete(it.i);updPick()};
    d.append(mk('b','',it.t||it.id),mk('span','',[it.c,dur(it.d),it.known?t('pk_known'):''].filter(Boolean).join(' · ')));
    lb.append(cb,d);li.append(lb);l.append(li);
  });
  updPick();
}
function openPick(x){
  const known=knownIds();
  pick.title=x.title||'';pick.items=x.items||[];
  pick.items.forEach(i=>{i.known=!!i.id&&known.has(i.id)});
  pick.sel=new Set(pick.items.filter(i=>!i.known).map(i=>i.i));
  drawPick();show('pview');
}
function onEvent(e){
  if(e.t==='ready'){engVer=e.m;$('#ver').textContent=e.m}
  else if(e.t==='queue'){
    const prev=curJob;
    jobs=e.x||[];
    const r=jobs.find(j=>j.state==='running');
    curJob=r?r.id:0;
    if(curJob&&curJob!==prev){rp=0;item=0;total=0;if(!$('#dl').hidden)resetDl()}
    drawQueue();
  }
  else if(e.t==='meta'){
    if(e.m)$('#dtitle').textContent=e.m;
    if(e.n&&e.n.indexOf('data:image/')===0){$('#dimg').src=e.n;$('#dimg').hidden=false;$('#dph').hidden=true}
  }
  else if(e.t==='progress'&&e.m.indexOf('[saving]')===0){$('#pst').textContent=t('saving')}
  else if(e.t==='progress'){
    const x=/item (\d+) of (\d+)/.exec(e.m);
    if(x){item=+x[1];total=+x[2]}
    let p=Math.max(0,Math.min(100,e.p));
    if(total)p=((item-1)+p/100)/total*100;
    const conv=/ExtractAudio|Merger|ffmpeg/i.test(e.m);
    rp=p;setP(p);
    $('#pst').textContent=conv?t('converting'):(total?t('song',item,total):t('downloading'));
    const b=$('#qbar');if(b)b.style.width=p+'%';
    const s=$('#qst');if(s)s.textContent=Math.round(p)+'%';
  }
  else if(e.t==='done'){
    say(t('ok'));setP(100);endDl(t('saved_in')+' '+e.m);
    const x=e.x||{};
    hist.unshift({n:e.n,w:e.m,t:Date.now(),req:x.req,ch:x.ch,pl:x.pl,items:x.items,v:x.v,m:x.m});hist=hist.slice(0,100);
    saveHist();drawRecent();drawHist();
  }
  else if(e.t==='error'){
    const code=(e.m||'').split('|')[0];
    say(tm(e.m),true);
    if(!$('#dl').hidden)endDl(tm(e.m),true,code);
  }
  else if(e.t==='cancelled'){closeDl();say(t('cancelled'))}
  else if(e.t==='info'){say(tm(e.m))}
  else if(e.t==='list'){
    if(e.x&&e.x.rid===rid){$('#opick').disabled=false;$('#opick').textContent=t('pk_open');openPick(e.x)}
  }
  else if(e.t==='list_err'){
    $('#opick').disabled=false;$('#opick').textContent=t('pk_open');
    const ps=$('#psel');ps.hidden=false;ps.textContent=tm(e.m);
  }
}
$('#gear').onclick=()=>{const m=$('#menu');m.hidden=!m.hidden;$('#gear').setAttribute('aria-expanded',String(!m.hidden))};
document.addEventListener('click',e=>{if(!e.target.closest('#menu,#gear'))closeMenu()});
$('#mhist').onclick=()=>{closeMenu();drawHist();show('hview')};
$('#mmus').onclick=()=>{P.music=!(P.music!==false);sv('p',P);syncMenu();try{A.music(P.music)}catch(e){}};
$('#micon').onclick=()=>{P.iconSync=!P.iconSync;sv('p',P);syncMenu();try{A.icon(P.iconSync?P.theme:'purple')}catch(e){}};
$('#mmob').onclick=()=>{P.mobile=!(P.mobile!==false);sv('p',P);syncMenu()};
$('#mtog').onclick=()=>{P.showHist=!P.showHist;sv('p',P);syncMenu();drawRecent()};
document.querySelectorAll('.tsw').forEach(b=>b.onclick=()=>{P.theme=b.dataset.th;sv('p',P);applyTheme();if(P.iconSync){try{A.icon(P.theme)}catch(e){}}});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!THEMES[P.theme])applyTheme()})}catch(e){}
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{P.lang=b.dataset.l;sv('p',P);applyLang();drawRecent();drawHist()});
$('#hback').onclick=()=>show('home');
$('#oback').onclick=()=>show('home');
$('#hclear').onclick=()=>{
  const b=$('#hclear');
  if(!armed){armed=true;b.textContent=t('h_sure');setTimeout(()=>{armed=false;b.textContent=t('h_clear')},3000);return}
  hist=[];sv('h',hist);armed=false;b.textContent=t('h_clear');drawHist();drawRecent();
};
document.querySelectorAll('#otype button').forEach(b=>b.onclick=()=>{sel.type=b.dataset.t;renderOpts()});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{sel[c.dataset.k]=c.dataset.v;renderOpts()});
$('#url').oninput=sync;
$('#paste').onclick=()=>{$('#url').value=A.clip().trim();sync()};
$('#go').onclick=openOpts;
$('#othumb').onclick=()=>{sel.thumb=!sel.thumb;renderOpts()};
$('#ostart').onclick=()=>{
  const u=cur();
  const keep=Object.assign({},sel);delete keep.items;
  P=Object.assign(P,keep);sv('p',P);
  launch(u,sel.type,{vq:sel.vq,af:sel.af,aq:sel.aq,list:listMode,thumb:!!sel.thumb,items:sel.items||''});
};
$('#dcancel').onclick=()=>{$('#pst').textContent=t('cancelling');if(curJob)A.cancel(curJob)};
$('#dupd').onclick=()=>{closeDl();say(t('updating'));A.update()};
$('#opick').onclick=()=>{
  const b=$('#opick');b.disabled=true;b.textContent=t('pk_loading');
  try{A.listInfo(cur(),++rid)}catch(e){b.disabled=false;b.textContent=t('pk_open')}
};
$('#pback').onclick=()=>show('opts');
$('#pall').onclick=()=>{pick.sel=new Set(pick.items.map(i=>i.i));drawPick()};
$('#pnone').onclick=()=>{pick.sel=new Set();drawPick()};
$('#pnew').onclick=()=>{pick.sel=new Set(pick.items.filter(i=>!i.known).map(i=>i.i));drawPick()};
$('#pgo').onclick=()=>{sel.items=pick.sel.size===pick.items.length?'':ranges(pick.sel);show('opts');renderOpts()};
$('#dclose').onclick=closeDl;
$('#upd').onclick=()=>{say(t('updating'));A.update()};
function takeShared(){const l=A.pending();if(l){$('#url').value=l;sync();show('home')}}
engVer=A.ver()||'';
try{A.music(P.music!==false)}catch(e){}
applyLang();syncMenu();drawRecent();drawHist();sync();takeShared();
// si la pantalla se volvió a crear con una descarga en curso, se repinta la ventana de progreso
try{
  const L=A.live();
  if(L){
    const o=JSON.parse(L);
    onEvent({t:'queue',x:o.q});
    if(curJob){resetDl();openDl();if(o.meta)onEvent(o.meta);if(o.prog)onEvent(o.prog)}
  }
}catch(e){}
</script></body></html>
